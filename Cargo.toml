[package]
name = "epubveri"
version = "0.32.0"
edition = "2024"
rust-version = "1.88"
description = "Pure-Rust EPUB validator — a fast, JVM-free, embeddable alternative to epubcheck."
license = "AGPL-3.0-only OR LicenseRef-veripublica-Commercial"
repository = "https://github.com/veripublica/epubveri"
homepage = "https://github.com/veripublica/epubveri"
readme = "README.md"
keywords = ["epub", "epubcheck", "validator", "ebook", "ocf"]
categories = ["parser-implementations", "command-line-utilities"]
# The CLI is the only binary this package installs. Cargo otherwise turns any
# file under src/bin/ into another one, which is how a dev tool (`spike`)
# reached users' PATH through `cargo install epubveri`.
autobins = false

# `harness/` is the epubcheck-corpus measurement tool (Rust port of the
# former scripts/corpus.py) - kept as a separate workspace member so its
# dev-only dependencies (e.g. `regex`) never appear in this crate's own
# Cargo.toml.
[workspace]
members = ["harness", "epubveri-wasm"]

[lib]
name = "epubveri"
path = "src/lib.rs"

[[bin]]
name = "epubveri"
path = "src/main.rs"

[dependencies]
# Pure-Rust only (no C deps): zip's "deflate" feature uses flate2 -> zlib-rs (Rust),
# bzip2/zstd (C backends) are left disabled via default-features = false. The floor
# is 9.0.4: zip < 9.0.0 carries RUSTSEC-2026-0367/0368/0369, and 9.0.0-9.0.2 are
# yanked.
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
# Inflates stored and deflated entries from their raw bytes (`Ocf::inflate_index`),
# on the same pure-Rust backend zip's "deflate" feature selects.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
roxmltree = "0.21"
unicode-normalization = "0.1"
# CSS parsing: the sibling styloria crate (github.com/veripublica/styloria),
# consumed from crates.io like any external user (dogfooding). For local
# co-development of styloria, add an uncommitted override:
#   [patch.crates-io] styloria = { path = "../styloria" }
styloria = "0.16.1"
# The `--format json` machine envelope (FORMATS.md). Both are pure Rust, so the
# no-C-deps rule holds; the same serde types back the wasm binding's return
# value, so CLI, CI and the demo read one shape.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# opt-level 2 is measured, not a default left alone. Against 3, fat LTO and
# one codegen unit (2026-09-23, issue #137, 474-book shelf plus 4 MiB
# chapters): the shelf moved by 5% at most, and 3 + LTO made a 4 MiB chapter
# of plain paragraphs 80% slower (0.32 s -> 0.58 s, seven runs each). LTO did
# shrink the binary from 3.1 MB to 2.5 MB; that is the only case for it.
[profile.release]
opt-level = 2

# roxmltree parses recursively, and unoptimised each level costs ~20x the
# stack: on the 2 MiB thread `cargo test` gives every test, a debug build
# aborted at 125 levels, under `xmlguard::MAX_XML_DEPTH` (256). opt-level 1 for
# this one crate is enough for a 256-level document to validate there
# (measured 2026-09-23; found by epubsana). It applies to this workspace only:
# Cargo ignores a dependency's profile settings, so a consumer that runs
# epubveri in a debug build needs the same two lines in its own manifest.
[profile.dev.package.roxmltree]
opt-level = 1
