[package]
name = "epubveri-harness"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "corpus"
path = "src/corpus.rs"

# Adversarial-input generator and runner. Separate binary because it shares
# nothing with the corpus measurement: different inputs, different question.
[[bin]]
name = "hostile"
path = "src/hostile.rs"

# docs/COVERAGE.md generator: reads epubcheck's message sources and our
# src/ids.rs, so the published matrix cannot drift from either.
[[bin]]
name = "coverage"
path = "src/coverage.rs"

# epubcheck-vs-epubveri differ. Needs a JVM and epubcheck's jar (both outside
# this project's dependency tree, found under the gitignored corpus/tools/).
[[bin]]
name = "compare"
path = "src/compare.rs"

[dependencies]
epubveri = { path = ".." }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
regex = "1"
