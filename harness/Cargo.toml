[package]
name = "epubveri-harness"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "corpus"
path = "src/corpus.rs"

# Adversarial-input generator and runner. Separate binary because it shares
# nothing with the corpus measurement: different inputs, different question.
[[bin]]
name = "hostile"
path = "src/hostile.rs"

# docs/COVERAGE.md generator: reads epubcheck's message sources and our
# src/ids.rs, so the published matrix cannot drift from either.
[[bin]]
name = "coverage"
path = "src/coverage.rs"

# epubcheck-vs-epubveri differ. Needs a JVM and epubcheck's jar (both outside
# this project's dependency tree, found under the gitignored corpus/tools/).
[[bin]]
name = "compare"
path = "src/compare.rs"

# W3C's epub-tests conformance suite: packages the expanded publications and
# runs epubveri over them. No JVM — `compare` owns the oracle half. The clone
# is not vendored; see the binary's own docs.
[[bin]]
name = "epubtests"
path = "src/epubtests.rs"

# Cross-checks the version scope of every id we emit against epubcheck's own
# call sites. Candidates only; each still needs a probe.
[[bin]]
name = "versions"
path = "src/versions.rs"

# JSWolf's technique, made systematic: re-declare the shelf's EPUB 3 books as
# EPUB 2 so their HTML5-era markup meets the EPUB 2 rules. Transforms only —
# `compare` owns the oracle half.
[[bin]]
name = "downgrade"
path = "src/downgrade.rs"

[dependencies]
epubveri = { path = ".." }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
regex = "1"
