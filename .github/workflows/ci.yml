name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # ubuntu-latest ships stable Rust + rustfmt/clippy; we only add the
      # wasm target for the smoke builds below. (The styloria dependency now
      # comes from crates.io, so there's no sibling checkout to wire up.)
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check

      # Gating on clippy, not merely running it: a lint job that cannot fail
      # is a lint job nobody reads. The workspace was 40 warnings and one
      # deny-level error away from clean when this was added; clearing them
      # first is what makes `-D warnings` meaningful rather than a permanent
      # red X. styloria has had this since its own CI was created.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build (workspace)
        run: cargo build --workspace --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

      # Prove the validator still compiles to WebAssembly: the core library
      # and the epubveri-wasm bindings crate (which exercises the
      # wasm-bindgen / tsify codegen). A full `wasm-pack build` is run locally
      # before publishing; this is the lighter, tooling-free CI smoke test.
      - name: Build core lib for wasm32
        run: cargo build --lib --target wasm32-unknown-unknown --locked

      - name: Build epubveri-wasm for wasm32
        run: cargo build -p epubveri-wasm --target wasm32-unknown-unknown --locked

  # Supply chain. Split from `check` on purpose: this job's result depends on
  # the RustSec advisory database, not on our commit, so it can turn red
  # without anything here changing - and when it does, that is news rather
  # than a broken build. Keeping it separate means the red X names the cause.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The action is the maintained path (it caches the advisory DB and
      # annotates the diff); `cargo install cargo-audit` per run is a slow
      # source build for the same answer.
      #
      # Node 20 note (checked 2026-08-18): this is the only action left in
      # this repo on the deprecated Node 20 runtime, and it is left there on
      # purpose. Upstream's latest release is v2.0.0 (2024-09-23, `node20`);
      # Node 24 landed on their `main` on 2026-03-20 (PR #48) and has gone
      # unreleased since, with their issue #53 "make new release" open and
      # unanswered. So there is nothing to bump to - `@v2` still serves
      # node20.
      #
      # The decision is to wait, and to pin to `rustsec/audit-check@858dc40f`
      # only if no release comes and GitHub's removal of Node 20 breaks this
      # job. That fallback is cheap because their Node 24 commit did not
      # rebuild `dist/index.js`: the blob is byte-identical to v2.0.0
      # (cb58b3398fd5aaa21674e8e3ddb5643af12a5275, 1433161 bytes), so pinning
      # would change the declared runtime and not a line of running code.
      # Re-verify that hash before pinning - their `main` may have moved.
      #
      # Scope note: today's tree is clean of *vulnerabilities* but carries one
      # unmaintained-crate warning, and warnings do not fail this job - only
      # an actual advisory does. That is the intent: an unmaintained
      # dependency is a thing to plan around, a vulnerability is a thing to
      # stop for.
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
