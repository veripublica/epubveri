name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # **The toolchain is pinned, and bumping it is a commit.** This job used to
  # take whatever stable `ubuntu-latest` happened to ship, which meant a Rust
  # release could turn CI red with nothing of ours having changed — the one
  # input to this build that moved on someone else's schedule. `Cargo.lock` is
  # committed for exactly this reason; the compiler had no equivalent.
  #
  # The cost is real and accepted: pinning also means we stop learning that a
  # new stable breaks us until someone raises this line. That is the same
  # trade as a lockfile, and the same answer — move it deliberately, with the
  # test suite as the evidence, rather than discovering it mid-release.
  #
  # Bump this the way a dependency is bumped: raise it, let the run go green,
  # commit. It does not have to track the newest stable.
  RUST_VERSION: "1.98.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Done with `rustup` rather than a toolchain action on purpose: rustup is
      # already on the runner, and this repo would rather not take another
      # action into the supply chain for something a two-line `run` does (see
      # the audit job below for how much thought the one action here costs).
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          rustc -V && cargo -V

      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check

      # Gating on clippy, not merely running it: a lint job that cannot fail
      # is a lint job nobody reads. The workspace was 40 warnings and one
      # deny-level error away from clean when this was added; clearing them
      # first is what makes `-D warnings` meaningful rather than a permanent
      # red X. styloria has had this since its own CI was created.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Rustdoc is a gate here for the same reason clippy is: a link to a
      # private item, a bare URL, or a ``` block that is not the Rust it claims
      # to be are all silent everywhere else, and they reach published docs.
      - name: Docs (no broken links)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build (workspace)
        run: cargo build --workspace --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

      # Prove the validator still compiles to WebAssembly: the core library
      # and the epubveri-wasm bindings crate (which exercises the
      # wasm-bindgen / tsify codegen). A full `wasm-pack build` is run locally
      # before publishing; this is the lighter, tooling-free CI smoke test.
      - name: Build core lib for wasm32
        run: cargo build --lib --target wasm32-unknown-unknown --locked

      - name: Build epubveri-wasm for wasm32
        run: cargo build -p epubveri-wasm --target wasm32-unknown-unknown --locked

  # **The published MSRV, actually tested.** `rust-version` in Cargo.toml is a
  # promise on crates.io — cargo refuses to resolve a dependency that needs
  # more, and a user on an older toolchain reads it as "this will build". It
  # was declared and nothing verified it, so it was an unverified claim of
  # exactly the kind this project keeps catching elsewhere.
  #
  # **The version is read out of Cargo.toml rather than written here**, which
  # is the whole point: a hard-coded number would be a second declaration free
  # to drift from the first, reproducing the defect one layer down. Raise
  # `rust-version` and this job tests the new floor on the next push; nothing
  # else to edit.
  #
  # `check` rather than `test`: the promise is that the crate *compiles* on
  # that toolchain. Dev-dependencies and the test harness are ours, not a
  # consumer's, and holding them to the floor would tighten the promise past
  # what it says.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$v" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"

      - name: Install it
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default "${{ steps.msrv.outputs.version }}"
          rustc -V

      - name: Compile at the floor
        run: cargo check --workspace --locked

  # Supply chain. Split from `check` on purpose: this job's result depends on
  # the RustSec advisory database, not on our commit, so it can turn red
  # without anything here changing - and when it does, that is news rather
  # than a broken build. Keeping it separate means the red X names the cause.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The action is the maintained path (it caches the advisory DB and
      # annotates the diff); `cargo install cargo-audit` per run is a slow
      # source build for the same answer.
      #
      # Node 20 note (checked 2026-08-18): this is the only action left in
      # this repo on the deprecated Node 20 runtime, and it is left there on
      # purpose. Upstream's latest release is v2.0.0 (2024-09-23, `node20`);
      # Node 24 landed on their `main` on 2026-03-20 (PR #48) and has gone
      # unreleased since, with their issue #53 "make new release" open and
      # unanswered. So there is nothing to bump to - `@v2` still serves
      # node20.
      #
      # The decision is to wait, and to pin to `rustsec/audit-check@858dc40f`
      # only if no release comes and GitHub's removal of Node 20 breaks this
      # job. That fallback is cheap because their Node 24 commit did not
      # rebuild `dist/index.js`: the blob is byte-identical to v2.0.0
      # (cb58b3398fd5aaa21674e8e3ddb5643af12a5275, 1433161 bytes), so pinning
      # would change the declared runtime and not a line of running code.
      # Re-verify that hash before pinning - their `main` may have moved.
      #
      # Scope note: warnings do not fail this job - only an actual advisory
      # does. That is the intent: an unmaintained dependency is a thing to plan
      # around, a vulnerability is a thing to stop for.
      #
      # ("today's tree ... carries one unmaintained-crate warning" was true
      # when written and is not now - the 2026-09-09 run reports "No
      # vulnerabilities were found / No warnings were found", the warning
      # having left with the move off `tsify-next`. Read it off a run rather
      # than off this comment.)
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
